name: Update episodes

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # gh workflow run (deploy の dispatch) に必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate episodes.json
        run: python3 scripts/update_episodes.py
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet src/episodes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/episodes.json
            git commit -m "episodes.json を RSS から自動更新"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to episodes.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        id: commit
      - name: Trigger deploy
        # GITHUB_TOKEN による push は workflow を起動しないため、明示的に deploy を dispatch する
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
